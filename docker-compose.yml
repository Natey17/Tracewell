services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracewell
      POSTGRES_PASSWORD: tracewell
      POSTGRES_DB: tracewell
    ports:
      - "5433:5432"
    volumes:
      - tracewell_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracewell"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tracewell:tracewell@postgres:5432/tracewell?schema=public
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: 4000
      SCANNER_INTERVAL_SECONDS: ${SCANNER_INTERVAL_SECONDS:-30}
      STUCK_ORDER_THRESHOLD_MINUTES: ${STUCK_ORDER_THRESHOLD_MINUTES:-60}
      DATA_FLOW_GAP_THRESHOLD_MINUTES: ${DATA_FLOW_GAP_THRESHOLD_MINUTES:-120}
    ports:
      - "4000:4000"

  seed:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tracewell:tracewell@postgres:5432/tracewell?schema=public
    working_dir: /app/packages/db
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && npm run seed"]
    profiles: ["seed"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  tracewell_pg_data:
